<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resultados Sanvi Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏁%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1a1a1a;--mut:#6b6b66;--bd:#e2e2dc;--ac:#d6361f;--pb:#7b3fe4;--ok:#1a7f4b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c20;--tx:#ececec;--mut:#9b9ba1;--bd:#2f2f36;--ac:#ff5a43;--pb:#b592ff;--ok:#4cd08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--card:#1c1c20;--tx:#ececec;--mut:#9b9ba1;--bd:#2f2f36;--ac:#ff5a43;--pb:#b592ff;--ok:#4cd08a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.w{overflow-x:auto}
.chip.del{color:var(--ac);border-color:var(--ac)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mut);font-weight:600}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
tr:last-child td{border-bottom:0}
.pb{color:var(--pb);font-weight:700}.me{color:var(--ok);font-weight:700}.mut{color:var(--mut)}
.bests{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.b{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.b b{display:block;font-size:18px;color:var(--pb)}
.up{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}

.err{color:var(--ac)}
input:not([type=file]){background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}
.btn.big{padding:8px 16px}
table.l th,table.l td{text-align:left}
table.l th{background:color-mix(in srgb,var(--ac) 12%,transparent);vertical-align:top}
th select{font-size:12px;padding:3px 6px;margin-top:4px;max-width:150px;font-weight:400}
.g1{color:#c99700;font-weight:600}.g2{color:#8a949f;font-weight:600}.g3{color:#b8692a;font-weight:600}
.card.hl{border-top:3px solid var(--ac)}
@media (max-width:600px){
body{font-size:14px}
main{padding:12px 8px 32px}
h1{font-size:18px}
.card{padding:10px;margin:10px 0}
th,td{padding:6px 5px}
th{font-size:11px}
table.l td,table.l th{white-space:normal}
table.l .g1,table.l .g2,table.l .g3{display:block}
.hm{display:none}
th select{max-width:100%;width:100%}
.bests{grid-template-columns:repeat(3,1fr)}
.b{padding:6px 8px}.b b{font-size:15px}
.chip{padding:6px 12px}
.up input:not([type=file]){flex:1 1 140px;min-width:0}
}
</style></head>
<body><main><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s);
let races=[],sel=null,drv=null,err='',admin=false,showLogin=false,msg='',confirmDel=false;
try{admin=sessionStorage.getItem('adm')==='1'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=ms=>{const m=Math.floor(ms/60000),s=(ms%60000)/1000;return m+':'+s.toFixed(3).padStart(6,'0')};
const sec=ms=>(ms/1000).toFixed(3);
const nice=s=>{const t=String(s||'').replace(/[_-]+/g,' ').trim();if(t.toLowerCase()==='historico')return 'Histórico';return t.charAt(0).toUpperCase()+t.slice(1)};
const carName=m=>(m||'').replace('tc2000_2024_','TC2000 ').replace(/^(TC2000 )?./,x=>x.toUpperCase());
const fdate=(d,t)=>new Date(d+'T'+t).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+t+' hs';

function parseRace(j,fname){
  const m=fname.match(/(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d{2})/);
  if(!m)return null;
  const date=`${m[1]}-${m[2]}-${m[3]}`,time=`${m[4]}:${m[5]}`;
  const ok=v=>v>0&&v<999999999;
  const results=(j.Result||[]).filter(r=>r.DriverName).map(r=>({car:r.CarId,name:r.DriverName,model:r.CarModel,best:ok(r.BestLap)?r.BestLap:null,total:r.TotalTime>0?r.TotalTime:null}));
  const lapsBy={};
  (j.Laps||[]).forEach(l=>(lapsBy[l.CarId]=lapsBy[l.CarId]||[]).push([l.LapTime,...(l.Sectors||[]),l.Cuts||0]));
  return{id:date+' '+time,date,time,track:j.TrackName,config:j.TrackConfig,type:j.Type,laps:j.RaceLaps,results,lapsBy};
}
const toRace=(j,f)=>j.Result?parseRace(j,f):(j.results&&j.lapsBy?j:null);

async function load(){
  try{
    const idx=await (await fetch('data/index.json?'+Date.now())).json();
    const out=await Promise.all(idx.map(async f=>{try{const x=toRace(await (await fetch('data/'+encodeURIComponent(f))).json(),f);if(x)x.file=f;return x}catch(e){return null}}));
    races=out.filter(Boolean);
  }catch(e){err='No se pudo leer data/index.json'}
  render();
}

function render(){
  const rs=[...races].sort((a,b)=>b.id.localeCompare(a.id));
  if(!rs.find(r=>r.id===sel))sel=rs[0]?.id??null;
  const r=rs.find(x=>x.id===sel);
  let h=panel(r)+summary(rs);
  if(!r){h+=`<div class="card ${err?'err':''}">${esc(err||'Todavía no hay carreras cargadas.')}</div>`;$('#app').innerHTML=h;bindAdmin();return}
  const dates=[...new Set(rs.map(x=>x.date))];
  h+=`<div class="up" style="margin:12px 0 6px"><label class="sub" for="ds">Fecha</label><select id="ds">`+dates.map(d=>`<option value="${d}" ${d===r.date?'selected':''}>${d.split('-').reverse().join('/')}</option>`).join('')+'</select></div>';
  h+='<div class="sub">Hora de la carrera</div><div class="chips">'+rs.filter(x=>x.date===r.date).sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`<button class="chip ${x.id===sel?'on':''}" data-r="${esc(x.id)}">${x.time} hs</button>`).join('')+'</div>';
  const all=Object.entries(r.lapsBy).flatMap(([c,ls])=>ls.map(l=>({c:+c,l})));
  const nm=c=>r.results.find(x=>x.car===c)?.name||'';
  const nl=x=>(r.lapsBy[x.car]||[]).length;
  const fin=x=>x.total&&nl(x)>=r.laps;
  const rows=[...r.results].sort((a,b)=>(fin(b)?1:0)-(fin(a)?1:0)||nl(b)-nl(a)||(a.total??Infinity)-(b.total??Infinity));
  const win=rows.find(fin);
  const bestS=[0,1,2].map(i=>all.reduce((a,x)=>x.l[i+1]<a.l[i+1]?x:a,all[0]));
  const bestL=all.length?Math.min(...all.map(x=>x.l[0])):null;
  h+=`<div class="card"><h2>${esc(nice(r.track))} · ${esc(nice(r.config))} · ${esc(r.type)}</h2><div class="sub">${fdate(r.date,r.time)} · ${r.laps} vueltas</div></div>`;
  h+='<div class="card"><h2>Resultados de Carrera</h2><div class="w"><table><tr><th>Pos</th><th>Piloto</th><th>Auto</th><th>Tiempo total</th><th>Dif.</th><th>Mejor vuelta</th></tr>';
  let p=0;
  rows.forEach(x=>{
    const f=fin(x);if(f)p++;
    const tot=f?fm(x.total):`<span class="mut">No terminó (${nl(x)}/${r.laps} vueltas)</span>`;
    h+=`<tr><td>${f?p:'—'}</td><td>${esc(x.name)}</td><td class="mut">${esc(carName(x.model))}</td><td>${tot}</td><td>${f?(x===win?'—':'+'+sec(x.total-win.total)):''}</td><td class="${x.best&&x.best===bestL?'pb':''}">${x.best?fm(x.best):'—'}</td></tr>`;
  });
  h+='</table></div></div>';
  if(all.length){
    h+='<div class="card"><h2>Mejores sectores de la carrera (segundos)</h2><div class="bests">'+bestS.map((b,i)=>`<div class="b"><span class="sub">Sector ${i+1}</span><b>${sec(b.l[i+1])}</b><span class="sub">${esc(nm(b.c))}</span></div>`).join('')+'</div></div>';
    const withLaps=rows.filter(x=>r.lapsBy[x.car]);
    if(!withLaps.find(x=>x.car===drv))drv=withLaps[0]?.car;
    const ls=r.lapsBy[drv],dm=Math.min(...ls.map(l=>l[0]));
    h+='<div class="card"><h2>Vuelta por vuelta</h2><div class="chips">'+withLaps.map(x=>`<button class="chip ${x.car===drv?'on':''}" data-d="${x.car}">${esc(x.name)} · ${esc(carName(x.model))}</button>`).join('')+'</div>';
    h+='<div class="w"><table><tr><th>Vuelta</th><th></th><th>Tiempo</th><th>S1 (s)</th><th>S2 (s)</th><th>S3 (s)</th><th>Cortes</th></tr>';
    ls.forEach((l,i)=>{
      const cell=k=>`<td class="${l[k]===bestS[k-1].l[k]?'pb':''}">${sec(l[k])}</td>`;
      h+=`<tr><td>${i+1}</td><td></td><td class="${l[0]===dm?'me':''}">${fm(l[0])}</td>${cell(1)}${cell(2)}${cell(3)}<td>${l[4]||0}</td></tr>`;
    });
    h+='</table></div><div class="sub" style="margin-top:8px"><span class="me">Verde</span>: mejor vuelta del piloto · <span class="pb">Violeta</span>: mejor sector de la carrera</div></div>';
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{sel=b.dataset.r;confirmDel=false;render()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{drv=+b.dataset.d;render()});
  bindAdmin();
  $('#ds').onchange=e=>{const c=races.filter(x=>x.date===e.target.value).sort((a,b)=>b.time.localeCompare(a.time));if(c[0]){sel=c[0].id;render()}};
}
const PTS=[25,18,15];
function classified(r){
  const nl=x=>(r.lapsBy[x.car]||[]).length;
  return r.results.filter(x=>x.total&&nl(x)>=r.laps).sort((a,b)=>a.total-b.total);
}
const flt={};
const MED=['#e0a800','#9aa4af','#c27a35'];
const trophy=c=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="${c}" style="vertical-align:-3px;margin-right:6px"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm-1 4v1a2 2 0 0 0 2 2V7H6zm12 0h-2v3a2 2 0 0 0 2-2V7z"/></svg>`;
function summary(rs){
  if(!rs.length)return '';
  const tot={},E=[];
  rs.forEach(r=>{
    const top=classified(r).slice(0,3);
    top.forEach((x,i)=>{const k=x.name.trim().toLowerCase();(tot[k]=tot[k]||{name:x.name.trim(),pts:0}).pts+=PTS[i]});
    E.push({r,top});
  });
  const fd=flt.date===undefined?rs[0].date:flt.date;
  const circ=r=>nice(r.track)+' · '+nice(r.config);
  const uniq=a=>[...new Set(a)];
  const keep=E.filter(({r,top})=>(!fd||r.date===fd)&&(!flt.time||r.time===flt.time)&&(!flt.circ||circ(r)===flt.circ)&&[0,1,2].every(i=>!flt['p'+i]||top[i]?.name===flt['p'+i]));
  const sl=(k,vals,cur,fmt=v=>v)=>`<div><select data-f="${k}"><option value="">Todos</option>${vals.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(fmt(v))}</option>`).join('')}</select></div>`;
  const pil=i=>uniq(E.map(e=>e.top[i]?.name).filter(Boolean)).sort();
  const head=`<tr><th>Fecha${sl('date',uniq(E.map(e=>e.r.date)),fd,d=>d.split('-').reverse().join('/'))}</th><th class="hm">Hora${sl('time',uniq(E.map(e=>e.r.time)).sort(),flt.time)}</th><th>Circuito${sl('circ',uniq(E.map(e=>circ(e.r))),flt.circ)}</th>`+['1er','2da','3era'].map((t,i)=>`<th>${t} posición${sl('p'+i,pil(i),flt['p'+i])}</th>`).join('')+'</tr>';
  const cls=['g1','g2','g3'];
  const c=(top,i)=>top[i]?`${esc(top[i].name)} <span class="${cls[i]}">(+${PTS[i]}p)</span>`:'—';
  const rows=keep.map(({r,top})=>`<tr><td>${r.date.split('-').reverse().join('/')}</td><td class="hm">${r.time} hs</td><td>${esc(circ(r))}</td><td>${c(top,0)}</td><td>${c(top,1)}</td><td>${c(top,2)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No hay carreras con esos filtros</td></tr>';
  const top10=Object.values(tot).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name)).slice(0,10);
  const prow=top10.map((x,i)=>`<tr${i<3?` style="background:color-mix(in srgb,${MED[i]} 16%,transparent)"`:''}><td>${i<3?trophy(MED[i]):'<span style="display:inline-block;width:24px"></span>'}${i+1}. ${esc(x.name)}</td><td><b${i<3?` style="color:${MED[i]}"`:''}>${x.pts}</b></td></tr>`).join('')||'<tr><td colspan="2" class="mut">Sin puntos todavía</td></tr>';
  return `<div class="card hl"><h2>Podio de cada carrera</h2><div class="w"><table class="l">${head}${rows}</table></div></div>`
   +`<div class="card hl"><h2>Tabla de Posiciones Top 10</h2><div class="w"><table class="l"><tr><th>Piloto</th><th>Puntos</th></tr>${prow}</table></div></div>`;
}
const REPO='juanetche28/sanvi-server-assettocorsa';
const HASH='14c701ef47345e160ca8905d4f3ebdeafebe716d056242016f41d44a472333ca';
const getTk=()=>{try{return localStorage.getItem('ghtk')||''}catch(e){return ''}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gh(method,path,body){
  const res=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+getTk(),Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(res.status===404&&method==='GET')return null;
  if(!res.ok)throw new Error(res.status===401||res.status===403?'token inválido, vencido o sin permisos':'GitHub respondió '+res.status);
  return res.json();
}
async function setIndex(fn){
  const cur=await gh('GET','data/index.json');
  let list=[];try{list=JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g,'')))))}catch(e){}
  list=[...new Set(fn(list))].sort();
  await gh('PUT','data/index.json',{message:'Actualizar lista de carreras',content:b64(JSON.stringify(list)),sha:cur?.sha});
}
const setMsg=t=>{msg=t;render()};
async function upload(e){
  const files=[...e.target.files];if(!files.length)return;
  try{
    for(const file of files){
      if(!/\d{4}_\d{2}_\d{2}_\d{2}_\d{2}/.test(file.name))throw new Error(file.name+': el nombre debe incluir fecha y hora (AAAA_MM_DD_HH_MM_RACE.json)');
      const text=await file.text(),race=toRace(JSON.parse(text),file.name);
      if(!race||!race.results.length)throw new Error(file.name+': no parece un resultado de carrera');
      setMsg('Subiendo '+file.name+'…');
      const old=await gh('GET','data/'+file.name);
      await gh('PUT','data/'+file.name,{message:'Subir '+file.name,content:b64(text),sha:old?.sha});
      await setIndex(l=>[...l,file.name]);
      race.file=file.name;races=races.filter(x=>x.id!==race.id).concat(race);sel=race.id;
    }
    msg='Listo ✓ Los demás lo van a ver en 1–2 minutos.';
  }catch(err){msg='Error: '+err.message}
  render();
}
async function del(){
  const r=races.find(x=>x.id===sel);if(!r)return;
  confirmDel=false;
  try{
    setMsg('Eliminando…');
    const f=await gh('GET','data/'+r.file);
    if(f)await gh('DELETE','data/'+r.file,{message:'Eliminar '+r.file,sha:f.sha});
    await setIndex(l=>l.filter(x=>x!==r.file));
    races=races.filter(x=>x!==r);sel=null;msg='Carrera eliminada ✓ Los demás lo ven en 1–2 minutos.';
  }catch(err){msg='Error: '+err.message}
  render();
}
function panel(r){
  const head=`<div class="up" style="justify-content:space-between"><div><h1>🏁 Resultados Sanvi Server</h1><div class="sub">Carreras del grupo</div></div><button class="chip" id="adm">${admin?'Cerrar sesión admin':'🔒 Admin login'}</button></div>`;
  const m=msg?`<div class="sub" style="margin-top:8px;flex-basis:100%">${esc(msg)}</div>`:'';
  if(!admin&&!showLogin)return head;
  if(!admin)return head+`<div class="card up"><input id="lu" placeholder="Usuario" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" id="lgo">Ingresar</button>${m}</div>`;
  if(!getTk())return head+`<div class="card"><h2>Conectar con GitHub</h2><div class="sub">Pegá tu token de GitHub (se guarda solo en este dispositivo).</div><div class="up" style="margin-top:8px"><input id="tk" type="password" placeholder="github_pat_..."><button class="btn" id="tksave">Guardar</button></div>${m}</div>`;
  return head+`<div class="card"><div class="up"><input type="file" id="f" accept=".json" multiple><button class="chip" id="tkchg">Cambiar token</button></div><div class="sub" style="margin-top:6px">El archivo debe llamarse con fecha y hora, ej: 2026_10_15_20_50_RACE.json</div>${r?`<button class="chip del" id="del" style="margin-top:10px">${confirmDel?'¿Seguro? Tocá de nuevo para eliminar':'🗑 Eliminar la carrera seleccionada'}</button>`:''}${m}</div>`;
}
function bindAdmin(){
  const g=id=>document.getElementById(id);
  g('adm').onclick=()=>{if(admin){admin=false;try{sessionStorage.removeItem('adm')}catch(e){}}else showLogin=!showLogin;msg='';render()};
  if(g('lgo')){
    g('lgo').onclick=async()=>{if((await sha(g('lu').value.trim()+':'+g('lp').value))===HASH){admin=true;showLogin=false;msg='';try{sessionStorage.setItem('adm','1')}catch(e){}}else msg='Usuario o contraseña incorrectos';render()};
    g('lp').onkeydown=e=>{if(e.key==='Enter')g('lgo').click()};
  }
  if(g('tksave'))g('tksave').onclick=()=>{const v=g('tk').value.trim();if(v){try{localStorage.setItem('ghtk',v)}catch(e){}msg=''}render()};
  if(g('tkchg'))g('tkchg').onclick=()=>{try{localStorage.removeItem('ghtk')}catch(e){}msg='';render()};
  document.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{flt[x.dataset.f]=x.value;render()});
  if(g('f'))g('f').onchange=upload;
  if(g('del'))g('del').onclick=()=>{if(!confirmDel){confirmDel=true;render()}else del()};
}
load();
</script></body></html>
